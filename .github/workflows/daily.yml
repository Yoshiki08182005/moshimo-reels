name: moshimo-daily
# Secrets never reach the AI step or the logs:
#  - IG_ACCESS_TOKEN only exists in the "stats" and "Publish" steps (IG_USER_ID is a non-secret repo variable)
#  - checkout uses persist-credentials: false; the push token is only used in the save / notify steps
#  - no pull_request triggers (forks can never run this with secrets)
#  - SFX audio is downloaded from its source each run and never committed (license: no redistribution)
on:
  schedule:
    - cron: '0 22 * * *'   # 07:00 JST (slot 0)
    - cron: '0 3 * * *'    # 12:00 JST (slot 1)
    - cron: '0 11 * * *'   # 20:00 JST (slot 2)
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = AIで企画・制作→投稿 / no-post = AIで制作のみ / post-eps = 用意済みエピソードを書き出して投稿 / render-only = 書き出しテスト / ai-check = Claudeのログイン確認'
        default: 'full'
      ep:
        description: 'render-only: エピソード名 / post-eps: カンマ区切り（moshimo-3d/queue/<ep>.json が必要）'
        default: 'ep10_chiisaku'
      from_run:
        description: 'post-eps: 書き出し済みの動画を使う実行ID（失敗した回の video アーティファクト）。空なら書き出す'
        default: ''

concurrency: { group: "moshimo-${{ inputs.mode == 'post-eps' && 'eps' || 'main' }}", cancel-in-progress: false }
permissions: { contents: write, issues: write, id-token: write, actions: read }

jobs:
  ai-check:   # quick diagnosis of the Claude login (no secrets are printed)
    if: inputs.mode == 'ai-check'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Clean Claude token (strip spaces / line breaks from copy-paste)
        id: tok
        env: { RAW: '${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}' }
        run: |
          t=$(printf %s "$RAW" | tr -d '[:space:]')
          echo "::add-mask::$t"
          echo "v=$t" >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ steps.tok.outputs.v }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: '1+1は？数字だけ答えて'
          show_full_output: true
          claude_args: --model sonnet --max-turns 2

  stats-check:   # fetch view stats only (no secrets are printed)
    if: inputs.mode == 'stats'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Collect view stats
        env:
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PYTHONUTF8: '1'
        run: |
          python tools/stats.py
          python -c "import json;d=json.load(open('moshimo-3d/marketing/stats.json',encoding='utf-8'));[print(p['hours'],'h',p.get('views'),'views',p['title'][:30]) for p in d['posts'][:8]];print('bench',[(b['username'],b['followers']) for b in d['benchmarks']])"

  make:
    if: inputs.mode != 'ai-check' && inputs.mode != 'stats'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      MODE: ${{ github.event_name == 'schedule' && 'full' || inputs.mode }}
      SLOT: ${{ github.event.schedule == '0 22 * * *' && '7時' || github.event.schedule == '0 3 * * *' && '12時' || github.event.schedule == '0 11 * * *' && '20時' || 'manual' }}
      MOSHIMO_SS: '1'
      MOSHIMO_MAX_MB: '45'
      PYTHONUTF8: '1'
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install render deps
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-noto-cjk fonts-noto-cjk-extra
          pip install -q playwright pillow numpy
          python -m playwright install --with-deps chromium
          cd moshimo-3d && npm ci --silent
      - name: Fetch sound effects from source
        run: python tools/fetch_sfx.py

      - name: Collect view stats (for the marketing role)
        if: env.MODE == 'full' || env.MODE == 'no-post'
        env:
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python tools/stats.py || true

      - name: Load prompt
        id: p
        if: env.MODE == 'full' || env.MODE == 'no-post'
        run: |
          { echo 'text<<__PROMPT_EOF__'; cat .github/prompts/daily.md; echo '__PROMPT_EOF__'; } >> "$GITHUB_OUTPUT"
      - name: Clean Claude token (strip spaces / line breaks from copy-paste)
        id: tok
        if: env.MODE == 'full' || env.MODE == 'no-post'
        env: { RAW: '${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}' }
        run: |
          t=$(printf %s "$RAW" | tr -d '[:space:]')
          echo "::add-mask::$t"
          echo "v=$t" >> "$GITHUB_OUTPUT"
      - name: Plan and create episode with Claude
        if: env.MODE == 'full' || env.MODE == 'no-post'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ steps.tok.outputs.v }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: ${{ steps.p.outputs.text }}
          claude_args: >-
            --model sonnet --max-turns 180
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch"

      - name: Publish to Instagram (resumable upload)
        if: env.MODE == 'full'
        env:
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish.py

      - name: Render and post prepared episodes
        if: env.MODE == 'post-eps'
        env:
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          EPS: ${{ inputs.ep }}
          FROM_RUN: ${{ inputs.from_run }}
          GH_TOKEN: ${{ github.token }}
        run: python tools/post_eps.py

      - name: Render existing episode (test)
        if: env.MODE == 'render-only'
        working-directory: moshimo-3d
        run: |
          time python render.py "${{ inputs.ep }}" full
          python render.py "${{ inputs.ep }}" clean 6.5 && python cover.py "${{ inputs.ep }}" "もしも|テスト|の" "書き出し" "OK！"

      - name: Upload video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: |
            moshimo-3d/out/*/final.mp4
            moshimo-3d/out/*/cover.jpg
            moshimo-3d/out/*/sheet.jpg
            moshimo-3d/out/next.json
          if-no-files-found: ignore

      - name: Save episode and logs
        if: always() && env.MODE != 'render-only'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          git config user.name moshimo-bot
          git config user.email moshimo-bot@users.noreply.github.com
          for p in moshimo-3d/episodes moshimo-3d/engine moshimo-3d/posted.json moshimo-3d/topics.json moshimo-3d/marketing moshimo-3d/queue sfx-library/sfx.json; do
            [ -e "$p" ] && git add -A "$p"
          done
          git diff --cached --quiet && exit 0
          git commit -qm "episode $(date +%F_%H%M) [$MODE slot $SLOT]"
          MINE=$(git rev-parse HEAD)
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          for i in 1 2 3; do
            git fetch -q "$REMOTE" main
            if ! git rebase -q FETCH_HEAD; then
              # another run saved logs at the same time: merge posted.json / history.jsonl instead of failing
              python tools/merge_logs.py "$MINE" FETCH_HEAD && GIT_EDITOR=true git rebase --continue || { git rebase --abort; sleep 5; continue; }
            fi
            git push -q "$REMOTE" HEAD:main && break
            sleep 5
          done

      - name: Notify the owner (GitHub notification on the progress issue)
        if: always() && env.MODE != 'render-only' && vars.NOTIFY_ISSUE != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OWNER: ${{ github.repository_owner }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            if [ "$JOB_STATUS" = "success" ]; then echo "@$OWNER ✅ $(date '+%m/%d %H:%M') の回が完了"; else echo "@$OWNER ⚠️ $(date '+%m/%d %H:%M') の回で問題が発生（$JOB_STATUS）。次の回は自動で続きます"; fi
            echo
            [ -f moshimo-3d/out/posted_urls.txt ] && { echo "**投稿:**"; sed 's/^/- /' moshimo-3d/out/posted_urls.txt; echo; }
            [ -f moshimo-3d/out/report.md ] && cat moshimo-3d/out/report.md
            echo; echo "<sub>実行ログ: $RUN_URL</sub>"
          } > /tmp/notify.md
          gh issue comment "${{ vars.NOTIFY_ISSUE }}" -R "${{ github.repository }}" --body-file /tmp/notify.md
